<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alt Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>👻 Alt Dashboard</h1>
    <p>Manage your 26 alt accounts</p>
</header>

<main>

    <section class="totals card">
        <h2>Current Totals</h2>

        <div class="total-grid">
            <div>
                <span>Tower Tokens</span>
                <strong id="totalTokens">0</strong>
            </div>

            <div>
                <span>Limbo Keys</span>
                <strong id="totalKeys">0</strong>
            </div>

            <div>
                <span>Server Boosts</span>
                <strong id="totalBoosts">0</strong>
            </div>
        </div>
    </section>


    <section class="controls card">

    <label>
        Sort:
        <select id="sortSelect">
            <option value="default">Default</option>
            <option value="completed">Completed First</option>
            <option value="uncompleted">Uncompleted First</option>
        </select>
    </label>

    <button id="resetAll" class="danger">
        Reset All Alts
    </button>

    <button id="addAlt" class="add-alt">
        + Add Alt
    </button>

    <div class="backup-controls">

        <button id="downloadBackup">
            💾 Download Backup
        </button>

        <button id="restoreBackup">
            📥 Restore Backup
        </button>

        <input
            type="file"
            id="backupFile"
            accept=".json"
            hidden
        >

    </div>

</section>

    <section id="altsContainer" class="alts-grid"></section>

</main>
<script src="alts.js"></script>

</body>
</html>
